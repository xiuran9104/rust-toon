# Example only: this file is deliberately excluded from kustomization.yaml.
# Copy it outside the repository, replace every value, apply it, and then
# remove the plaintext copy. REPLACE_ME values intentionally fail closed.
apiVersion: v1
kind: Secret
metadata:
  name: rust-toon-gateway-secrets
  namespace: rust-toon
  labels:
    app.kubernetes.io/part-of: rust-toon
type: Opaque
stringData:
  # Percent-encode reserved characters in the database password.
  DATABASE_URL: "REPLACE_ME"
  # Use rediss:// when the managed Redis endpoint supports TLS.
  REDIS_URL: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  SECRET_ENCRYPTION_KEY: "REPLACE_ME"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  # These bootstrap credentials must initially match the r-nacos admin Secret.
  # Create a least-privilege application user later, then rotate these values.
  NACOS_USERNAME: "REPLACE_ME"
  NACOS_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: rust-toon-worker-secrets
  namespace: rust-toon
  labels:
    app.kubernetes.io/part-of: rust-toon
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  # Use a credentialed tls:// URL, or mount NATS credentials in an overlay.
  NATS_URL: "REPLACE_ME"
  NACOS_USERNAME: "REPLACE_ME"
  NACOS_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: rust-toon-rnacos-secrets
  namespace: rust-toon
  labels:
    app.kubernetes.io/part-of: rust-toon
type: Opaque
stringData:
  RNACOS_INIT_ADMIN_USERNAME: "REPLACE_ME"
  RNACOS_INIT_ADMIN_PASSWORD: "REPLACE_ME"
  RNACOS_CLUSTER_TOKEN: "REPLACE_ME"
  # r-nacos enables the backup API only when this value is at least 32 bytes.
  RNACOS_BACKUP_TOKEN: "REPLACE_ME_AT_LEAST_32_RANDOM_BYTES"
---
apiVersion: v1
kind: Secret
metadata:
  name: rust-toon-observability-secrets
  namespace: rust-toon
  labels:
    app.kubernetes.io/part-of: rust-toon
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_ME"
