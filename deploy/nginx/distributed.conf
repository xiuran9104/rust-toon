log_format rust_toon_path_only
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

upstream gateway_pool {
    zone gateway_pool 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server gateway:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Do not use $request, $request_uri, or $args here. The legacy WebSocket
    # handshake can carry a short-lived token in the query string.
    access_log /var/log/nginx/access.log rust_toon_path_only;

    client_max_body_size 2g;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_set_header Host $host;
    # This edge is the trusted proxy boundary. Replace any client-supplied
    # forwarding chain so callers cannot choose their rate-limit identity.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location = /edge-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Prometheus scrapes Gateway directly over the private service network.
    # Never expose the unauthenticated operations endpoint at the edge.
    location = /metrics {
        return 404;
    }

    location = /api/metrics {
        return 404;
    }

    # The production frontend uses VITE_GLOB_API_URL=/api. Gateway routes do
    # not include that outer transport prefix, so strip exactly one /api/.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://gateway_pool;
    }

    # Keep direct routes available for probes and API-only installations.
    location / {
        proxy_pass http://gateway_pool;
    }
}
