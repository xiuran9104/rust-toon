[package]
name = "rust-toon-s3ctl"
description = "Minimal S3-compatible storage client used by backup and e2e scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "s3ctl"
path = "src/main.rs"

[dependencies]
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "fs"] }
