[workspace]
resolver = "3"
members = [
    "crates/framework/common",
    "crates/framework/dynamic-config",
    "crates/framework/database",
    "crates/framework/jobs",
    "crates/framework/mq",
    "crates/framework/redis",
    "crates/framework/resilience",
    "crates/framework/security",
    "crates/framework/telemetry",
    "crates/framework/tenant",
    "crates/framework/web",
    "crates/modules/infra-api",
    "crates/modules/infra-server",
    "crates/modules/ai-api",
    "crates/modules/ai-server",
    "crates/modules/media-api",
    "crates/modules/media-server",
    "crates/modules/system-api",
    "crates/modules/system-server",
    "crates/modules/toon-api",
    "crates/modules/toon-server",
    "crates/tools/s3ctl",
    "services/gateway",
    "services/toon-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.com/rust-toon"

[workspace.dependencies]
anyhow = "1.0"
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "nkeys", "ring", "server_2_10"] }
async-trait = "0.1"
argon2 = "0.5"
base64 = "0.22"
bcrypt = "0.17"
axum = { version = "0.8", features = ["multipart"] }
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
croner = "3.0.1"
jsonwebtoken = "10.3"
nacos-sdk = { version = "0.8.1", default-features = false, features = ["auth-by-http", "config"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "tls-webpki-roots"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
prometheus-client = "0.25"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
redis = { version = "0.32", default-features = false, features = ["aio", "tokio-comp"] }
rust_xlsxwriter = "0.96"
rust-toon-framework-common = { path = "crates/framework/common" }
rust-toon-framework-dynamic-config = { path = "crates/framework/dynamic-config" }
rust-toon-framework-database = { path = "crates/framework/database" }
rust-toon-framework-jobs = { path = "crates/framework/jobs" }
rust-toon-framework-mq = { path = "crates/framework/mq" }
rust-toon-framework-redis = { path = "crates/framework/redis" }
rust-toon-framework-resilience = { path = "crates/framework/resilience" }
rust-toon-framework-security = { path = "crates/framework/security" }
rust-toon-framework-telemetry = { path = "crates/framework/telemetry" }
rust-toon-framework-tenant = { path = "crates/framework/tenant" }
rust-toon-framework-web = { path = "crates/framework/web" }
rust-toon-infra-api = { path = "crates/modules/infra-api" }
rust-toon-infra-server = { path = "crates/modules/infra-server" }
rust-toon-ai-api = { path = "crates/modules/ai-api" }
rust-toon-ai-server = { path = "crates/modules/ai-server" }
rust-toon-media-api = { path = "crates/modules/media-api" }
rust-toon-media-server = { path = "crates/modules/media-server" }
rust-toon-system-api = { path = "crates/modules/system-api" }
rust-toon-system-server = { path = "crates/modules/system-server" }
rust-toon-toon-api = { path = "crates/modules/toon-api" }
rust-toon-toon-server = { path = "crates/modules/toon-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-resilience = { version = "0.13.0", default-features = false, features = ["bulkhead", "circuitbreaker", "tracing"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.16", features = ["serde", "v4"] }
zip = "8.6"
