# cargo-audit 豁免记录：每条 id 上方的注释即不可达理由，上游修复后移除。
[advisories]
ignore = [
    # rsa 仅由 sqlx-mysql 引入（sqlx macros 编译期解析），cargo tree -e normal/build
    # 均不可达；运行时只链接 PostgreSQL 驱动，MySQL 认证的 RSA 时序路径不存在于
    # 任何发布二进制中。上游无修复版本（RUSTSEC-2023-0071，Marvin Attack）。
    "RUSTSEC-2023-0071",

    # ---- zip 7.4.0 / 8.6.0，2026-11-24 逐条核实 ----
    # zip 8.6.0 有两类使用方：infra-server 与 toon-server 只用 ZipWriter 写包（导出）；
    # calamine 用 ZipArchive::new + by_name/by_index 读取用户上传的 xlsx/xlsb/ods。
    # zip 7.4.0 只有 rust_xlsxwriter：ZipWriter 写包，另有一处 read_theme_from_path
    # 读取应用指定的本地主题文件，本仓库从未调用。
    # 这三方的源码里都没有 ZipArchive::extract / ZipStreamReader（工作区自有的
    # .extract( 调用是 OpenTelemetry 的上下文提取，与 zip 无关）。以下 6 条都发生在
    # 解压到磁盘的路径上：
    #   RUSTSEC-2026-0367 解压时保留 SUID/SGID 位
    #   RUSTSEC-2026-0368 extract 创建指向目标目录之外的符号链接
    #   RUSTSEC-2026-0369 extract 经符号链接施加 Unix 权限
    #   RUSTSEC-2026-0429 extract 遇到大声明尺寸的符号链接条目时中止进程
    #   RUSTSEC-2026-0546 extract 经绝对/链式符号链接写到目标目录之外
    #   RUSTSEC-2026-0548 ZipStreamReader 按本地文件头名解压条目
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0548",
    # AES 条目在数据提前结束时不再校验认证码。zip 在未提供密码时对加密条目直接
    # 返回 InvalidPassword（zip-8.6.0 src/read/readers.rs），条目根本不会被读出；
    # calamine 源码中没有任何设置 zip 密码的调用。
    "RUSTSEC-2026-0545",
    # 旧式 Shrink/Reduce/Implode 解码器按声明尺寸预分配内存。这些解码器位于
    # zip 的 legacy-zip 特性之后，而本仓库构建启用的 zip 特性不含它
    # （8.6.0: aes-crypto bzip2 deflate deflate64 lzma ppmd time xz zstd；
    #   7.4.0: deflate），相关代码没有被编译。
    "RUSTSEC-2026-0547",
    # 以上 zip 条目的复核方式：
    #   cargo tree -e features -i zip@8.6.0 -f "{p} {f}"
    #   grep -rnE "ZipArchive|ZipStreamReader|\.extract\(" crates services
    # 上游修复只存在于 zip 9.x（>=9.0.0 / >=9.0.5），calamine 0.38 依赖 zip ^8；
    # calamine 或 infra-server 改用 zip 9 后移除这些条目。

    # libsqlite3-sys 0.30.1 不参与任何编译：cargo tree -e normal,build,dev --workspace
    # 中不存在它。sqlx 没有启用 sqlite 特性，它只作为 sqlx-sqlite 的可选依赖留在
    # Cargo.lock 里。sqlx 已升级 0.9.1（libsqlite3-sys 允许范围扩到 <0.40），但
    # sqlite 特性仍关闭，锁文件里停留在 0.30.1；该版本范围内的告警持续豁免，
    # 直至某次依赖刷新把它推出 0.30.x。
    "RUSTSEC-2026-0459",
]
